# The OpenAPI specification for Yandex Cloud API Gateway.
# Фактически - роутер-маршрутизатор. В paths - хендлеры
# 
openapi: "3.0.0"
info:
  version: 1.0.0
  title: Test API
paths:
  /:
    get:
      summary: Say hello
      operationId: hello
      parameters:
        - name: us
          in: query
          description: User name to appear in greetings
          required: false
          schema:
            type: string
            default: 'every buddy'
      responses:
        '200':
          description: Greeting
          content:
            'text/plain':
              schema:
                type: "string"
      x-yc-apigateway-integration:
        type: dummy
        http_code: 200
        http_headers:
          'Content-Type': "text/plain"
        content:
          'text/plain': "Hello, {us}!\n" # для задания имени user https://******.apigw.yandexcloud.net/hello?user=uname
  /mlook:
    get:
      responses:
        '200':
          description: Greeting
          content:
            'text/plain':
              schema:
                type: "string"
        '502':
          description: Greeting
          content:
            'text/plain':
              schema:
                type: "string"
                default: "errorrrr "
      x-yc-apigateway-integration:
        type: cloud-functions
        service_account_id: ${invoker_said} # SA для invoker
        function_id: ${fgoy}  # Code.Sender получение и вывод метрик на экран, без БД
        http_code: 200
        http_headers:
          'Content-Type': "text/plain"
        
  /mwrite:
    get:
      responses:
        '200':
          description: Ok
        '503':
          description: not ok
      x-yc-apigateway-integration:
        type: cloud-functions
        service_account_id: ${invoker_said} # SA для invoker
        function_id: ${fwrite}  # dbaser.WriteMetrics
  /mread:
    get:
      responses:
        '200':
          description: Ok
        '503':
          description: not ok
      x-yc-apigateway-integration:
        type: cloud-functions
        service_account_id: ${invoker_said} # SA для invoker
        function_id: ${fread}  # dbaser.ReadMetrics
        
  /update/{mname}/{mvalue}:
    get:
      parameters:
        - name: mname
          in: path
          description: Metric Name
          required: true
          schema:
            type: string
        - name: mvalue
          in: path
          description: Metric value
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Ok
        '503':
          description: not ok
      x-yc-apigateway-integration:
        type: cloud-functions
        service_account_id: ${invoker_said} # SA для invoker
        function_id: ${fputt}  # dbaser.PutMetric
        context:
          mname: '{mname}'
          mvalue: '{mvalue}'
        
  /value/{mname}:
    get:
      parameters:
        - name: mname
          in: path
          description: Metric Name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ok
        '502':
          description: not ok
          content:
           'text/plain':
              schema:
                type: "string"
                default: "errorrrrrrrrrrrr "    
      x-yc-apigateway-integration:
        type: cloud-functions
        service_account_id: ${invoker_said} # SA для invoker
        function_id: ${fgett}  # dbaser.GetMetric
        context:
          mname: '{mname}'
        
